<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飞书知识问答 - 登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1e2433;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 48px 40px;
      width: 380px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
    }
    .login-logo {
      width: 56px;
      height: 56px;
      background: #3370ff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .login-logo svg {
      width: 32px;
      height: 32px;
      color: white;
    }
    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .login-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 36px;
      line-height: 1.6;
    }
    .login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 24px;
      background: #3370ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
      letter-spacing: 0.3px;
    }
    .login-btn:hover {
      background: #245bdb;
    }
    .login-btn:active {
      transform: scale(0.98);
    }
    .login-btn:disabled {
      background: #2a3a5e;
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
      transform: none;
    }
    .login-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .login-footer {
      margin-top: 28px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
      line-height: 1.6;
    }
    .error-msg {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(245, 74, 69, 0.12);
      border: 1px solid rgba(245, 74, 69, 0.25);
      border-radius: 8px;
      color: #f54a45;
      font-size: 13px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <div class="login-title">飞书知识问答</div>
    <div class="login-subtitle">基于飞书知识库的问答助手</div>
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      使用飞书登录
    </button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="login-footer">登录即代表你同意使用飞书身份访问你的知识库</div>
  </div>

  <script>
    async function handleLogin() {
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = '正在跳转...';
      errEl.classList.remove('show');
      try {
        const redirect = encodeURIComponent(window.location.pathname && window.location.pathname !== '/login.html' ? window.location.pathname : '/');
        const res = await fetch('/api/auth/feishu/login-url?redirect=' + redirect);
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || '获取登录链接失败');
        }
        const data = await res.json();
        if (!data.url) throw new Error('登录链接无效');
        window.location.href = data.url;
      } catch (e) {
        errEl.textContent = e.message || '登录失败，请重试';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> 使用飞书登录';
      }
    }
  </script>
</body>
</html>
